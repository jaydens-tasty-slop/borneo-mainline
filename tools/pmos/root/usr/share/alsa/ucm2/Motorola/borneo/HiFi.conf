# The earpiece and both microphones. The loudspeaker isn't here because it doesn't work yet:
# see the AW882xx notes for this phone.
#
# There are no hardware volume controls here on purpose: at 100%, userspace would take these
# digital gains from 0 dB to their +40 dB maximum, which turned the mic into clipped noise and
# could harm the earpiece. So the gains stay where the sequences below put them, and PipeWire's
# software volume does the rest.

SectionVerb {
	# PipeWire and PulseAudio probe by opening the PCMs with no device enabled, and a PCM with no
	# backend routed to it won't open. So the routing is the verb's, not the devices'.
	EnableSequence [
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 1"
	]

	DisableSequence [
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 0"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece"

	EnableSequence [
		cset "name='RX_MACRO RX0 MUX' AIF1_PB"
		cset "name='RX INT0_1 MIX1 INP0' RX0"
		cset "name='RX INT0 DEM MUX' CLSH_DSM_OUT"
		cset "name='HPHL Switch' 1"
		cset "name='CLSH PA Switch' 1"
		cset "name='EAR_RDAC Switch' 1"
		cset "name='RDAC3_MUX' RX1"
		cset "name='RX_EAR Mode Switch' 1"
		cset "name='RX_RX0 Digital Volume' 66"
	]

	DisableSequence [
		cset "name='RX_EAR Mode Switch' 0"
		cset "name='EAR_RDAC Switch' 0"
		cset "name='CLSH PA Switch' 0"
		cset "name='HPHL Switch' 0"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

SectionDevice."Mic" {
	Comment "Handset Microphone"

	EnableSequence [
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 Switch' 1"
		cset "name='ADC1 Volume' 8"
		cset "name='TX_DEC0 Volume' 84"
	]

	DisableSequence [
		cset "name='ADC1 Switch' 0"
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
		CaptureChannels 1
	}
}
